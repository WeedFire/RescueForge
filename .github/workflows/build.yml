name: Build & Release (Windows)

# 触发方式：
# 1) 推送 v* 标签（如 v1.1.0）→ 构建并发布 Release
# 2) 手动触发（workflow_dispatch）→ 构建发布，用于验证
# 注意：不再对 push/PR 触发，避免每次提交都产生 draft release。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node >= 22.13（其内部依赖 node:sqlite 内置模块），
          # 用 Node 20 会直接崩溃：ERR_UNKNOWN_BUILTIN_MODULE: No such built-in module: node:sqlite
          # 本机开发环境为 Node v26 + pnpm 11.6.0，这里用 Node 22 满足下限并保持 lockfile 一致。
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本机 pnpm 11.6.0 保持同系列，避免跨大版本的依赖解析/hoisting 差异
          version: 11

      # 注：此前用 Python 脚本校验/生成图标，但 Windows runner 上通过 stdin 读 Python 时默认 cp1252 编码，
      # 脚本含中文注释会抛 UnicodeEncodeError。现已改为 PowerShell 原生校验，故不再需要 setup-python。

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 图标已提交到仓库（未被 .gitignore 忽略）。Tauri 硬性要求 PNG 为 RGBA(color type 6)
      # 且尺寸正确，否则报 `icon ... is not RGBA` 打包失败。
      # 用 PowerShell 原生校验（Windows runner 自带，不依赖 bash/Python heredoc，
      # 避免校验脚本自身成为失败点）。不合格时本地执行：pnpm tauri icon <源图.png>
      - name: Validate icons (must be RGBA)
        shell: pwsh
        run: |
          $targets = @{ '32x32.png' = 32; '128x128.png' = 128; '128x128@2x.png' = 256 }
          $ok = $true
          foreach ($name in $targets.Keys) {
            $size = $targets[$name]
            $p = Join-Path 'src-tauri/icons' $name
            if (-not (Test-Path $p)) {
              Write-Host "::error::missing icon $name"
              $ok = $false
              continue
            }
            $b = [System.IO.File]::ReadAllBytes($p)
            if ($b.Length -lt 26 -or $b[0] -ne 0x89 -or $b[1] -ne 0x50) {
              Write-Host "::error::$name is not a valid PNG"
              $ok = $false
              continue
            }
            $w = ($b[16] -shl 24) -bor ($b[17] -shl 16) -bor ($b[18] -shl 8) -bor $b[19]
            $h = ($b[20] -shl 24) -bor ($b[21] -shl 16) -bor ($b[22] -shl 8) -bor $b[23]
            $bitdepth = $b[24]
            $ctype = $b[25]
            if ($ctype -ne 6) {
              Write-Host "::error::$name colortype=$ctype (expected 6=RGBA). Regenerate: pnpm tauri icon <src.png>"
              $ok = $false
            } elseif ($bitdepth -ne 8) {
              Write-Host "::error::$name bitdepth=$bitdepth (expected 8)"
              $ok = $false
            } elseif ($w -ne $size -or $h -ne $size) {
              Write-Host "::error::$name size=${w}x${h} (expected ${size}x${size})"
              $ok = $false
            } else {
              Write-Host "OK: $name ${w}x${h} colortype=$ctype (RGBA)"
            }
          }
          if (-not (Test-Path 'src-tauri/icons/icon.icns')) {
            Write-Host "::error::missing icon.icns"
            $ok = $false
          }
          if (-not $ok) { exit 1 }
          Write-Host "All icons valid (RGBA, correct size)"

      # 必须在 src-ui 目录内执行：pnpm 从「当前工作目录」向上查找 pnpm-workspace.yaml，
      # 若在仓库根目录用 `--prefix src-ui`，pnpm 在根目录找不到该文件，
      # onlyBuiltDependencies 不生效 → ERR_PNPM_IGNORED_BUILDS (esbuild/vue-demi 构建脚本被忽略)。
      - name: Install frontend dependencies
        run: pnpm install
        working-directory: src-ui

      # 关键：GitHub Actions 的 Windows runner 控制台默认非 UTF-8 代码页，
      # productName 含中文时会被丢弃，产物变成 "_1.1.8_x64-setup.exe"（名称为空）。
      # 打包前切到 UTF-8 代码页并声明 UTF-8 环境变量。
      - name: Set UTF-8 encoding (fix Chinese productName)
        run: chcp 65001
        shell: cmd

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 强制 UTF-8，确保中文 productName 正确写入文件名
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONUTF8: '1'
          # 自动更新签名密钥（Release 构建必需）
          # 生成：cargo tauri signer generate -w ~/.tauri/rescueforge.key
          # 公钥填 tauri.conf.json 的 plugins.updater.pubkey
          # 私钥 base64 存 TAURI_SIGNING_PRIVATE_KEY，密码存 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 用 github.ref_name（即触发的 tag，如 v1.1.5）作为 release tag，
          # 避免 v__VERSION__（package.json 版本）与触发 tag 不一致导致 release 错乱。
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: '自动构建发布。更新内容见提交记录。'
          releaseDraft: false
          prerelease: false
          # 显式开启 latest.json 生成与上传（默认即 true，这里明确化）
          uploadUpdaterJson: true
          # 同时生成 .msi 和 NSIS .exe 时，latest.json 指向 NSIS .exe
          # （与用户实际安装的 _x64-setup.exe 一致，避免更新时下载 .msi 却装的是 .exe）
          updaterJsonPreferNsis: true
