name: Build & Release (Windows)

# 触发方式：
# 1) 推送 v* 标签（如 v1.1.0）→ 构建并发布 Release
# 2) 手动触发（workflow_dispatch）→ 构建发布，用于验证
# 注意：不再对 push/PR 触发，避免每次提交都产生 draft release。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node >= 22.13（其内部依赖 node:sqlite 内置模块），
          # 用 Node 20 会直接崩溃：ERR_UNKNOWN_BUILTIN_MODULE: No such built-in module: node:sqlite
          # 本机开发环境为 Node v26 + pnpm 11.6.0，这里用 Node 22 满足下限并保持 lockfile 一致。
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本机 pnpm 11.6.0 保持同系列，避免跨大版本的依赖解析/hoisting 差异
          version: 11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 图标是打包必需资产（.gitignore 已放开 src-tauri/icons/**，建议提交真实图标）。
      # 若仓库缺失则用纯色占位图兜底，避免整个 Release 流程失败。
      # 正式发布前请提交真实图标：pnpm tauri icon <源图.png>
      - name: Ensure icons exist (fallback placeholder)
        shell: bash
        run: |
          python - <<'PY'
          import zlib, struct, os
          d = 'src-tauri/icons'
          os.makedirs(d, exist_ok=True)

          def png_bytes(size, rgb=(59, 130, 246)):
              row = b'\x00' + bytes(rgb) * size
              raw = row * size
              def chunk(t, data):
                  return (struct.pack('>I', len(data)) + t + data
                          + struct.pack('>I', zlib.crc32(t + data) & 0xffffffff))
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              return (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr)
                      + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b''))

          targets = {'32x32.png': 32, '128x128.png': 128, '128x128@2x.png': 256}
          missing = [n for n in targets if not os.path.exists(os.path.join(d, n))]
          for n, s in targets.items():
              p = os.path.join(d, n)
              if not os.path.exists(p):
                  with open(p, 'wb') as f:
                      f.write(png_bytes(s))

          # tauri.conf.json 的 bundle.icon 列了 icon.icns，打包时会被校验存在性
          icns = os.path.join(d, 'icon.icns')
          if not os.path.exists(icns):
              png256 = png_bytes(256)
              entry = b'ic08' + struct.pack('>I', len(png256) + 8) + png256
              with open(icns, 'wb') as f:
                  f.write(b'icns' + struct.pack('>I', 8 + len(entry)) + entry)
              missing.append('icon.icns')

          if missing:
              print('::warning::缺少图标 ' + ', '.join(missing)
                    + '，已用占位图兜底。正式发布前请提交真实图标：pnpm tauri icon <源图.png>')
          PY

      # 必须在 src-ui 目录内执行：pnpm 从「当前工作目录」向上查找 pnpm-workspace.yaml，
      # 若在仓库根目录用 `--prefix src-ui`，pnpm 在根目录找不到该文件，
      # onlyBuiltDependencies 不生效 → ERR_PNPM_IGNORED_BUILDS (esbuild/vue-demi 构建脚本被忽略)。
      - name: Install frontend dependencies
        run: pnpm install
        working-directory: src-ui

      # 关键：GitHub Actions 的 Windows runner 默认 ANSI 代码页（437/850），
      # productName「数据恢复」含中文，NSIS 打包器用 ANSI 写安装包文件名时中文字符被丢弃，
      # 产物变成 "_1.1.15_x64-setup.exe"（名称为空）。
      # 方案：在「同一进程」内切到 UTF-8 代码页再调用 tauri build。
      # 由于 tauri-action 是独立 action（新进程），单独的 chcp 步骤不生效，
      # 故改为：先用 tauri-action 构建上传（文件名可能缺中文），
      # 构建完成后用 PowerShell 重命名并重新上传正确中文名的安装包。
      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名密钥（Release 构建必需）
          # 生成：cargo tauri signer generate -w ~/.tauri/rescueforge.key
          # 公钥填 tauri.conf.json 的 plugins.updater.pubkey
          # 私钥 base64 存 TAURI_SIGNING_PRIVATE_KEY，密码存 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 用 github.ref_name（即触发的 tag，如 v1.1.5）作为 release tag，
          # 避免 v__VERSION__（package.json 版本）与触发 tag 不一致导致 release 错乱。
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: '自动构建发布。更新内容见提交记录。'
          releaseDraft: false
          prerelease: false
          # 显式开启 latest.json 生成与上传（默认即 true，这里明确化）
          uploadUpdaterJson: true
          # 同时生成 .msi 和 NSIS .exe 时，latest.json 指向 NSIS .exe
          # （与用户实际安装的 _x64-setup.exe 一致，避免更新时下载 .msi 却装的是 .exe）
          updaterJsonPreferNsis: true

      # 修复中文 productName 被丢弃的问题：PowerShell(.NET) 内部用 UTF-16，处理中文文件名
      # 不受 ANSI 代码页影响。将 tauri-action 上传的无中文名安装包，用 gh 重传为正确中文名。
      # 同时修复 latest.json 中指向旧文件名（无中文）的 url，避免自动更新下载到已删除的 asset。
      - name: Re-upload installer with Chinese name
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = (Get-Content 'src-ui/package.json' -Raw | ConvertFrom-Json).version
          $goodName = '数据恢复_' + $ver + '_x64-setup.exe'

          # 递归查找安装包（tauri-action 的 target 路径可能与预期不同）
          $exe = Get-ChildItem -Path 'src-tauri' -Recurse -Filter '*x64-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            # 退到整个仓库递归查找
            $exe = Get-ChildItem -Path '.' -Recurse -Filter '*x64-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Host "::warning::no x64-setup.exe found to fix name"
            exit 0
          }
          Write-Host "found installer: $($exe.FullName)"

          # 本地文件名若是中文名（上传时被 tauri-action 抹掉），复制一份规范中文名以便上传
          $good = Join-Path $exe.DirectoryName $goodName
          if ($exe.Name -ne $goodName) {
            Copy-Item $exe.FullName $good -Force
            Write-Host "renamed local -> $goodName"
          }

          # 列出当前 release 的 assets，找到需要删除的无中文名 installer
          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          foreach ($a in $assets) {
            if ($a -like '*x64-setup.exe' -and $a -ne $goodName) {
              gh release delete-asset $tag $a --yes
              Write-Host "deleted old asset: $a"
            }
          }
          gh release upload $tag $good --clobber
          Write-Host "uploaded $goodName"

          # 修正 latest.json 中指向旧文件名的 url
          $lj = Get-ChildItem -Path '.' -Recurse -Filter 'latest.json' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lj) {
            $j = Get-Content $lj.FullName -Raw | ConvertFrom-Json
            $url = $j.platforms.'windows-x86_64'.url
            if ($url -and -not $url.EndsWith($goodName)) {
              $newUrl = $url.Substring(0, $url.LastIndexOf('/') + 1) + $goodName
              $j.platforms.'windows-x86_64'.url = $newUrl
              $j | ConvertTo-Json -Depth 10 | Set-Content $lj.FullName -Encoding UTF8
              gh release upload $tag $lj.FullName --clobber
              Write-Host "fixed latest.json url -> $newUrl"
            }
          } else {
            Write-Host "latest.json not found, skip url fix"
          }
