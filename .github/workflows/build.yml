name: Build & Release (Windows)

# 触发方式：
# 1) 推送 v* 标签（如 v1.1.0）→ 构建并发布 Release
# 2) 手动触发（workflow_dispatch）→ 构建发布，用于验证
# 注意：不再对 push/PR 触发，避免每次提交都产生 draft release。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node >= 22.13（其内部依赖 node:sqlite 内置模块），
          # 用 Node 20 会直接崩溃：ERR_UNKNOWN_BUILTIN_MODULE: No such built-in module: node:sqlite
          # 本机开发环境为 Node v26 + pnpm 11.6.0，这里用 Node 22 满足下限并保持 lockfile 一致。
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本机 pnpm 11.6.0 保持同系列，避免跨大版本的依赖解析/hoisting 差异
          version: 11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 图标是打包必需资产。Tauri 硬性要求：PNG 必须是 RGBA(color type 6) 且尺寸正确，
      # 否则报 `icon ... is not RGBA` 直接打包失败。
      # 这里不仅校验「文件是否存在」，还校验「格式/尺寸是否合格」，不合格一律覆盖生成。
      # 正式发布前建议提交真实图标：pnpm tauri icon <源图.png>
      - name: Ensure icons are valid RGBA (regenerate if invalid)
        shell: bash
        run: |
          python - <<'PY'
          import zlib, struct, os
          d = 'src-tauri/icons'
          os.makedirs(d, exist_ok=True)

          def write_rgba_png(path, size, rgb=(59, 130, 246), alpha=255):
              """写 RGBA PNG（color type 6）—— Tauri 硬性要求，RGB(2) 会报 is not RGBA。"""
              r, g, b = rgb
              row = b'\x00' + bytes((r, g, b, alpha)) * size
              raw = row * size
              def chunk(tag, data):
                  return (struct.pack('>I', len(data)) + tag + data
                          + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff))
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              png = (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr)
                     + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b''))
              with open(path, 'wb') as f:
                  f.write(png)

          def is_valid_rgba(path, size):
              """校验是否为指定尺寸的 RGBA PNG。"""
              try:
                  with open(path, 'rb') as f:
                      raw = f.read()
              except OSError:
                  return False
              if len(raw) < 26 or raw[:8] != b'\x89PNG\r\n\x1a\n':
                  return False
              w, h = struct.unpack('>II', raw[16:24])
              bitdepth, ctype = raw[24], raw[25]
              # color type 6 = RGBA
              return ctype == 6 and bitdepth == 8 and w == size and h == size

          targets = {'32x32.png': 32, '128x128.png': 128, '128x128@2x.png': 256}
          fixed = []
          for name, size in targets.items():
              p = os.path.join(d, name)
              if not is_valid_rgba(p, size):
                  write_rgba_png(p, size)
                  fixed.append(name)

          # tauri.conf.json 的 bundle.icon 列了 icon.icns，打包时会校验存在性
          icns = os.path.join(d, 'icon.icns')
          if not os.path.exists(icns):
              import io
              buf = io.BytesIO()
              # 复用上面的写入逻辑生成到内存
              tmp = os.path.join(d, '.tmp_256.png')
              write_rgba_png(tmp, 256)
              png256 = open(tmp, 'rb').read()
              os.remove(tmp)
              entry = b'ic08' + struct.pack('>I', len(png256) + 8) + png256
              with open(icns, 'wb') as f:
                  f.write(b'icns' + struct.pack('>I', 8 + len(entry)) + entry)
              fixed.append('icon.icns')

          if fixed:
              print('::warning::以下图标缺失或格式不合格(非RGBA/尺寸错)，已重新生成占位图: '
                    + ', '.join(fixed) + '。正式发布前请提交真实图标: pnpm tauri icon <源图.png>')
          else:
              print('图标校验通过(均为 RGBA 且尺寸正确)')
          PY

      # 必须在 src-ui 目录内执行：pnpm 从「当前工作目录」向上查找 pnpm-workspace.yaml，
      # 若在仓库根目录用 `--prefix src-ui`，pnpm 在根目录找不到该文件，
      # onlyBuiltDependencies 不生效 → ERR_PNPM_IGNORED_BUILDS (esbuild/vue-demi 构建脚本被忽略)。
      - name: Install frontend dependencies
        run: pnpm install
        working-directory: src-ui

      # 关键：GitHub Actions 的 Windows runner 控制台默认非 UTF-8 代码页，
      # productName 含中文时会被丢弃，产物变成 "_1.1.8_x64-setup.exe"（名称为空）。
      # 打包前切到 UTF-8 代码页并声明 UTF-8 环境变量。
      - name: Set UTF-8 encoding (fix Chinese productName)
        run: chcp 65001
        shell: cmd

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 强制 UTF-8，确保中文 productName 正确写入文件名
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONUTF8: '1'
          # 自动更新签名密钥（Release 构建必需）
          # 生成：cargo tauri signer generate -w ~/.tauri/rescueforge.key
          # 公钥填 tauri.conf.json 的 plugins.updater.pubkey
          # 私钥 base64 存 TAURI_SIGNING_PRIVATE_KEY，密码存 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 用 github.ref_name（即触发的 tag，如 v1.1.5）作为 release tag，
          # 避免 v__VERSION__（package.json 版本）与触发 tag 不一致导致 release 错乱。
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: '自动构建发布。更新内容见提交记录。'
          releaseDraft: false
          prerelease: false
          # 显式开启 latest.json 生成与上传（默认即 true，这里明确化）
          uploadUpdaterJson: true
          # 同时生成 .msi 和 NSIS .exe 时，latest.json 指向 NSIS .exe
          # （与用户实际安装的 _x64-setup.exe 一致，避免更新时下载 .msi 却装的是 .exe）
          updaterJsonPreferNsis: true
